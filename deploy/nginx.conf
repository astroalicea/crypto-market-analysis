# nginx site config. Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/crypto-market-analysis
#   sudo ln -s /etc/nginx/sites-available/crypto-market-analysis /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;

    # nginx serves static files straight from disk; much cheaper than waking up Django for a CSS file
    location /static/ {
        alias /srv/crypto-market-analysis/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # without Host, Django sees "127.0.0.1" and ALLOWED_HOSTS checks the wrong name
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
